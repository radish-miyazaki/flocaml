name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Prime the caches every Monday.
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - 4.14.x
          - 5.x
        include:
          # Build with Cygwin on 4.14 and with MSYS2 on 5.x, as opam-repo-ci
          # tries both. The shell of MSYS2 rewrites arguments that look like
          # paths.
          - os: windows-latest
            ocaml-compiler: 5.x
            windows-environment: msys2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          windows-environment: ${{ matrix.windows-environment || 'cygwin' }}

      - run: opam install . --deps-only --with-test --with-doc

      - run: opam exec -- dune build @install @runtest

      - run: opam exec -- dune build @doc

      # The opam file is generated from dune-project.
      - run: git diff --exit-code

  lower-bounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use OCaml 4.14.x
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 4.14.x

      # The same criteria as the lower-bounds check of opam-repository: the
      # oldest versions that the constraints allow.
      - run: opam install . --deps-only --with-test --solver=builtin-0install --criteria="+removed,+count[version-lag,solution]"

      - run: opam exec -- dune build @install @runtest

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use OCaml 5.x
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.x

      - name: Lint fmt
        uses: ocaml/setup-ocaml/lint-fmt@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1

  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use OCaml 5.x
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.x

      - name: Lint opam
        uses: ocaml/setup-ocaml/lint-opam@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1

  nix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Also runs the tests and the format and documentation checks.
      - run: nix build --print-build-logs
