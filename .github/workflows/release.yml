# Makes the GitHub Release for a pushed tag vX.Y.Z: builds the tarball from
# the tag, builds and tests it as opam-repository would, and publishes it with
# the section of CHANGES.md for that version. The pull request to
# opam-repository is left to a person; the summary of the run gives the url
# section for its opam file.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not of the form vX.Y.Z"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the version in flake.nix
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Fq "version = \"$VERSION\";" flake.nix; then
            echo "::error::flake.nix does not have version $VERSION"
            exit 1
          fi

      # The lines under "## X.Y.Z (date)" up to the next section, without the
      # blank lines around them.
      - name: Take the notes from CHANGES.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v); next }
            !found { next }
            NF == 0 { if (started) blank++; next }
            { for (; blank > 0; blank--) print ""; print; started = 1 }
          ' CHANGES.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::CHANGES.md has no section for $VERSION"
            exit 1
          fi
          cat dist/notes.md

      # The same command as for the earlier releases, which were made by hand,
      # so that the archives keep the same layout.
      - name: Build the tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar --prefix="nix-syntax-$VERSION/" HEAD |
            bzip2 -9 > "dist/nix-syntax-$VERSION.tbz"

      - name: Upload the tarball and the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: tarball
    runs-on: ubuntu-latest
    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      # Build from the tarball rather than from a checkout, so that a file
      # missing from the archive fails here.
      - name: Extract the tarball
        env:
          VERSION: ${{ needs.tarball.outputs.version }}
        run: tar xjf "$RUNNER_TEMP/dist/nix-syntax-$VERSION.tbz" --strip-components=1

      # Without the cache, nothing saved by another run goes into the test of
      # a release.
      - name: Use OCaml 5.x
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.x
          cache: false

      # As dune-release does on its archives, since the tag may be on a commit
      # that CI has not seen.
      - run: opam lint nix-syntax.opam

      - run: opam install . --deps-only --with-test

      # The build command of the opam file.
      - run: opam exec -- dune build -p nix-syntax @install @runtest

  release:
    needs: [tarball, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          gh release create "$TAG" "dist/nix-syntax-$VERSION.tbz" \
            --verify-tag --title "$VERSION" --notes-file dist/notes.md

      - name: Print the url section for opam-repository
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tarball.outputs.version }}
        run: |
          file="dist/nix-syntax-$VERSION.tbz"
          sha256=$(sha256sum "$file" | cut -d ' ' -f 1)
          sha512=$(sha512sum "$file" | cut -d ' ' -f 1)
          {
            echo 'url {'
            echo "  src: \"https://github.com/$REPO/releases/download/$TAG/nix-syntax-$VERSION.tbz\""
            echo '  checksum: ['
            echo "    \"sha256=$sha256\""
            echo "    \"sha512=$sha512\""
            echo '  ]'
            echo '}'
          } > url.opam
          cat url.opam
          {
            echo '## url section for opam-repository'
            echo
            echo '```'
            cat url.opam
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
