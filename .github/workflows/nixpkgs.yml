# Runs nix-syntax on every file of the nixpkgs pinned in flake.lock, and
# compares it with Nix's own parser. It takes a while, so it runs weekly and
# on demand rather than on every change.
name: nixpkgs

on:
  workflow_dispatch:
  schedule:
    - cron: 0 3 * * SUN

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Find the nixpkgs source
        run: |
          echo "NIXPKGS=$(nix flake archive --json | jq -r .inputs.nixpkgs.path)" >> "$GITHUB_ENV"

      - name: Print trees and tokens back
        run: |
          nix develop -c dune build ./test/roundtrip/main.exe
          find "$NIXPKGS" -name '*.nix' -type f -print0 |
            xargs -0 -n 500 _build/default/test/roundtrip/main.exe

      - name: Compare with nix-instantiate --parse
        run: nix develop -c env JOBS=4 test/oracle/compare.sh "$NIXPKGS"

      - name: Compare the rejected expressions
        run: nix develop -c test/oracle/cases.sh
